name: Builder

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Get changed files
        id: changed_files
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: jitterbit/get-changed-files@v1

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Get changed add-ons
        id: changed_addons
        env:
          addons: ${{ steps.addons.outputs.addons }}
          changed_files: ${{ steps.changed_files.outputs.all }}
          build_all: ${{ case(github.event_name == 'workflow_dispatch', '1', '0') }}
        run: |
          declare -a changed_addons
          for addon in $addons; do
            if [ $build_all -eq 1 ] || [[ "$changed_files" =~ $addon ]]; then
              changed_addons+=("\"${addon}\",");
            fi
          done

          changed=$(echo ${changed_addons[@]} | rev | cut -c 2- | rev)

          if [[ -n ${changed} ]]; then
            echo "Changed add-ons: $changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "addons=[$changed]" >> "$GITHUB_OUTPUT"
          else
            echo "No add-on had any monitored files changed";
          fi

      - name: Enumerate build matrix
        id: matrix
        env:
          addons: ${{ steps.changed_addons.outputs.addons }}
          arches: '["amd64", "aarch64"]'
        run: |
          matrix='{"include":[]}'
          for arch in $(jq -r '.[]' <<<"$arches"); do
            case "${arch}" in
              amd64)   os="ubuntu-26.04" ;;
              aarch64) os="ubuntu-26.04-arm" ;;
            esac
            for addon_index in $(jq 'range(0; .|length)' <<<"$addons"); do
              addon=$(jq -r --argjson index "$addon_index" '.[$index]' <<<"$addons")
              matrix=$(jq -c --arg arch "$arch" --arg os "$os" --arg addon "$addon" \
                       '.include += [{arch: $arch, os: $os, addon: $addon}]' <<<"$matrix")
            done
          done
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          {
            echo '# Build matrix'
            echo
            echo '```json'
            jq . <<<"$matrix"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.addon }} add-on for ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.init.output.matrix) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        env:
          image: ${{ fromJson(steps.info.outputs.image) }}
          architectures: ${{ steps.info.outputs.architectures }}
        run: |
          if [[ "$image" == "null" ]]; then
            echo "Image property is not defined, skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
          elif [[ "$architectures" =~ '"${{ matrix.arch }}"' ]]; then
            image_name=$(echo "$image" | cut -d'/' -f3)
            image_registry_prefix=$(echo $image | cut -d'/' -f1,2)
            echo "arched_image=$image_registry_prefix/${{ matrix.arch }}-$image_name" >> "$GITHUB_OUTPUT"
            echo "build_arch=true" >> "$GITHUB_OUTPUT"
            if [[ -z "${{ github.head_ref }}" ]] && [[ "${{ github.ref_name }}" == "master" ]]; then
                echo "push_image=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "${{ matrix.arch }} is not a valid arch for ${{ matrix.addon }}, skipping build";
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for build stages
        id: docker
        run: |
          builder=$(awk '$1 == "FROM" && $3 == "AS" { last_builder=$4 } END { print last_builder }' < "$dockerfile")
          if [ "$builder" != "" ]; then
            echo "builder=$builder" >> "$GITHUB_OUTPUT"
          fi
        env:
          dockerfile: ./${{ matrix.addon }}/Dockerfile

      - name: Build docker container
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          push: ${{ steps.check.outputs.push_image == 'true' }}
          version: ${{ fromJson(steps.info.outputs.version) }}
          image-tags: |
            ${{ fromJson(steps.info.outputs.version) }}
            latest
          skip-existing: ${{ fromJson(steps.info.outputs.version) }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ steps.check.outputs.arched_image }}
          context: ./${{ matrix.addon }}
          cache-gha-scope: ${{ matrix.addon }}
          cosign: false

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Publish multi-arch manifest for ${{ matrix.addon }}
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
    permissions:
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Prepare information
        id: prep
        env:
          image: ${{ fromJson(steps.info.outputs.image) }}
        run: |
          image_name=$(echo "$image" | cut -d'/' -f3)
          image_registry_prefix=$(echo $image | cut -d'/' -f1,2)
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "image_registry_prefix=$image_registry_prefix" >> "$GITHUB_OUTPUT"

      - name: Publish multi-arch manifest for ${{ matrix.addon }}
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.init.outputs.arches }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: false
          image-name: ${{ steps.prep.outputs.image_name }}
          registry-prefix: ${{ steps.prep.outputs.image_registry_prefix }}
          skip-existing: ${{ fromJson(steps.info.outputs.version) }}
          image-tags: |
            ${{ fromJson(steps.info.outputs.version) }}
            latest
