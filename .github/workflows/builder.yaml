name: Builder

env:
  MONITORED_FILES: "build.yaml config.yaml Dockerfile rootfs"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Get changed files
        id: changed_files
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: jitterbit/get-changed-files@v1

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Enumerate arches
        id: arches
        run: echo 'arches=["aarch64", "amd64", "armv7"]' >> "$GITHUB_OUTPUT"

      - name: Get changed add-ons
        id: changed_addons
        env:
          addons: ${{ steps.addons.outputs.addons }}
          changed_files: ${{ steps.changed_files.outputs.all }}
          build_all: ${{ case(github.event_name == 'workflow_dispatch', '1', '0') }}
        run: |
          declare -a changed_addons
          for addon in $addons; do
            if [ $build_all -eq 1 ] || [[ "$changed_files" =~ $addon ]]; then
              changed_addons+=("\"${addon}\",");
            fi
          done

          changed=$(echo ${changed_addons[@]} | rev | cut -c 2- | rev)

          if [[ -n ${changed} ]]; then
            echo "Changed add-ons: $changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "addons=[$changed]" >> "$GITHUB_OUTPUT"
          else
            echo "No add-on had any monitored files changed (${{ env.MONITORED_FILES }})";
          fi
  build:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ${{ fromJson(needs.init.outputs.arches) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        run: |
          if [[ "${{ steps.info.outputs.image }}" == "null" ]]; then
            echo "Image property is not defined, skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.info.outputs.architectures }}" =~ ${{ matrix.arch }} ]]; then
            echo "build_arch=true" >> "$GITHUB_OUTPUT"
            echo "image=$(echo ${{ steps.info.outputs.image }} | cut -d'/' -f3)" >> "$GITHUB_OUTPUT"
            if [[ -z "${{ github.head_ref }}" ]] && [[ "${{ github.event_name }}" == "push" ]]; then
                echo "push_image=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "${{ matrix.arch }} is not a valid arch for ${{ matrix.addon }}, skipping build";
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for build stages
        id: docker
        run: |
          builder=$(awk '$1 == "FROM" && $3 == "AS" { print $4; exit }' < "$dockerfile")
          if [ "$builder" != "" ]; then
            echo "builder=$builder" >> "$GITHUB_OUTPUT"
          fi
        env:
          dockerfile: ./${{ matrix.addon }}/Dockerfile

      - name: Login to GitHub Container Registry
        if: ${{ steps.check.outputs.push_image == 'true' }}
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Caching build step
        if: ${{ steps.docker.outputs.builder != '' }}
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          build-args: |
            target=${{ steps.docker.outputs.builder }}
          arch: ${{ matrix.arch }}
          push: false
          load: true
          version: ${{ steps.info.outputs.version }}
          image-tags: |
            latest-build
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ steps.check.outputs.image }}
          cache-gha-scope: ${{ matrix.addon }}
          cache-image-tag: latest-build
          cosign: false

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          push: ${{ steps.check.outputs.push_image == 'true' }}
          version: ${{ steps.info.outputs.version }}
          image-tags: |
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ steps.check.outputs.image }}
          cache-gha: false
          cosign: false

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
    permissions:
      packages: write
    steps:
      - name: Publish multi-arch manifest for ${{ matrix.addon }}
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.init.outputs.arches }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            latest
