name: "Wireguard"
description: "Wireguard access and firewall ruling for Home Assistant"
image: ghcr.io/ofenhed/hassio-addon-{arch}-wireguard
version: "0.1.27"
slug: "privileged-wireguard"
init: false
tmpfs: true
startup: services
stage: experimental
arch:
  - aarch64
  - amd64
  - armv7
ports:
  51820/udp: 51820
host_network: true
privileged:
  - NET_ADMIN
schema:
  block_non_wireguard: bool?
  route_table_id: int?
  log_status_interval: int?
  wg_interface_name: str?
  wg_private_key: str
  wg_config: str
  ip:
    - |
      match(^((((?!25?[6-9])[12]\d|[1-9])?\d\.?\b){4}|(([0-9a-fA-F]{1,4})?:)+:[0-9a-fA-F]{1,4})\/([12]?[0-9]|3[012])$)
